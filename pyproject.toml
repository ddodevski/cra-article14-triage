[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "art14"
version = "0.1.0"
description = "Extract from an SBOM the vulnerabilities that trigger a CRA Article 14 reporting obligation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cra", "article-14", "sbom", "cyclonedx", "kev", "euvd", "enisa"]
# No `License ::` classifier: the PEP 639 `license` and `license-files` fields
# above are the licence declaration, and setuptools refuses to carry both.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/ddodevski/cra-article14-triage"

[project.scripts]
art14 = "art14.cli:run"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["art14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
