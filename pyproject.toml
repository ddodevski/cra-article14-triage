[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cra-article14-triage"
version = "0.1.0.dev0"
description = "Extract from an SBOM the vulnerabilities that trigger a CRA Article 14 reporting obligation"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cra", "article-14", "sbom", "cyclonedx", "kev", "euvd", "enisa"]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
art14 = "art14.cli:run"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["art14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
