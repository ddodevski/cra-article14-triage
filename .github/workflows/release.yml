# Publish a tagged release to PyPI.
#
# Trusted Publishing: PyPI is told, once, that the `publish` job of this
# workflow in this repository may upload art14, and the job proves it is that
# job with a short-lived OIDC token GitHub mints for it. No API token is
# stored here or in the repository secrets, so there is nothing to leak and
# nothing to rotate. The two halves have to agree exactly -- project name,
# owner, repository, workflow filename, environment -- or the upload is
# rejected with no partial publish.
#
# Building and publishing are separate jobs on purpose. `id-token: write`
# is the permission that lets a job claim an identity to PyPI, so it is
# granted to the job that does nothing but upload an artifact it did not
# build, and the tests and the build run with no permissions at all.

name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The suite never opens a connection -- the OSV and KEV fixtures are
      # pinned -- so this is a real gate on a runner with no cache and no
      # credentials, not a smoke test.
      - name: Run the suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest

      - name: Build the distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      # No `password:` input. The action reads the OIDC token itself.
      - uses: pypa/gh-action-pypi-publish@release/v1
